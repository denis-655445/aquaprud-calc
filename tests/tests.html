<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тести ядра Aquaprud</title>
  <style>
    body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 24px; max-width: 720px; }
    li { margin: 4px 0; }
    .ok { color: #1b7a3a; }
    .fail { color: #b3261e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Тести ядра: розрахунок, геометрія, сходинки</h1>
  <p id="summary">Запуск…</p>
  <ul id="list"></ul>

  <!-- Ті самі файли ядра, що й у застосунку -->
  <script src="../core/calc.js?v=8"></script>
  <script src="../core/format.js?v=8"></script>
  <script src="../core/pondgeo.js?v=8"></script>
  <script src="../core/stairs.js?v=8"></script>
  <script src="../miniapp/js/sketch3d.js?v=8"></script>
  <script src="../data/catalog.sample.js?v=8"></script>
  <script src="calc.tests.js?v=8"></script>
  <script src="pondgeo.tests.js?v=8"></script>
  <script src="stairs.core.tests.js?v=8"></script>
  <script src="sketch3d.tests.js?v=8"></script>
  <script>
    // Запускаємо тести і показуємо результат списком
    // Ядро розрахунку (з тестовим каталогом) + геометрія 3D-схеми
    var results = CalcTests.run(Calc, Format, SAMPLE_CATALOG).concat(PondGeoTests.run(PondGeo))
      .concat(StairsTests.run(Stairs, Calc)).concat(Sketch3DTests.run(PondGeo, Sketch3D));
    var list = document.getElementById('list');
    results.forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fail';
      li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.error ? ' — ' + r.error : '');
      list.appendChild(li);
    });
    var failed = results.filter(function (r) { return !r.ok; }).length;
    document.getElementById('summary').textContent = failed
      ? 'Є помилки: ' + failed + ' з ' + results.length
      : 'Усі ' + results.length + ' тестів пройдено';
  </script>
</body>
</html>
